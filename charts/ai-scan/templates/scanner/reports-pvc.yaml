apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: reports
  labels: {app: review-api}
  annotations:
    helm.sh/resource-policy: keep
spec:
  accessModes: [ReadWriteOnce]
  {{- with .Values.postgres.storageClassName }}
  storageClassName: {{ . }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.scanner.reportsStorage }}
