{{- if .Values.secrets.create | default (not (hasKey .Values.secrets "create")) }}
{{- $s := .Values.secrets -}}
{{- $p := .Values.postgres -}}
apiVersion: v1
kind: Secret
metadata:
  name: db-secrets
  labels: {{- include "ai-scan.labels" . | nindent 4 }}
  annotations: {ai-scan.local/not-for-production: "true"}
type: Opaque
stringData:
  POSTGRES_USER: {{ $p.user | quote }}
  POSTGRES_PASSWORD: {{ $p.password | quote }}
  POSTGRES_DB: {{ $p.db | quote }}
  DATABASE_URL: {{ printf "postgresql+psycopg://%s:%s@postgres:5432/%s" $p.user $p.password $p.db | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: ai-keys-master
  labels: {{- include "ai-scan.labels" . | nindent 4 }}
  annotations: {ai-scan.local/not-for-production: "true"}
type: Opaque
stringData:
  AI_KEYS_ENCRYPTION_KEY: {{ required "secrets.aiKeysEncryptionKey is required" $s.aiKeysEncryptionKey | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: gateway-secrets
  labels: {{- include "ai-scan.labels" . | nindent 4 }}
  annotations: {ai-scan.local/not-for-production: "true"}
type: Opaque
stringData:
  GITHUB_CLIENT_ID: {{ $s.githubClientId | quote }}
  GITHUB_CLIENT_SECRET: {{ $s.githubClientSecret | quote }}
  GITHUB_WEBHOOK_SECRET: {{ $s.githubWebhookSecret | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: scanner-secrets
  labels: {{- include "ai-scan.labels" . | nindent 4 }}
  annotations: {ai-scan.local/not-for-production: "true"}
type: Opaque
stringData:
  INTERNAL_API_TOKEN: {{ $s.internalApiToken | quote }}
  AI_PROVIDER: {{ .Values.scanner.aiProvider | quote }}
  AI_MODEL: {{ .Values.scanner.aiModel | quote }}
  AI_BASE_URL: {{ .Values.scanner.aiBaseUrl | quote }}
  AI_API_KEY: {{ $s.aiApiKey | quote }}
{{- end }}
