# Default values for the ai-scan chart (local / Docker Desktop).
# NOT FOR PRODUCTION: the secrets below are well-known placeholders.

global:
  appEnv: local
  # Registry prefix for the app images. "" = local `docker build` names (ai-scan-repos-*).
  imageRegistry: ghcr.io/almog975
  imageTag: latest
  imagePullPolicy: IfNotPresent

# Per-image tags; "" = global.imageTag. The GitOps flow keeps these in values-images.yaml (CI bot writes
# the git SHA there, Argo CD deploys it; docs/cicd-docker-desktop.md).
imageTags:
  frontend: ""
  gateway: ""
  reviewApi: ""
  scanner: ""

# Image base names (final image = <imageRegistry>/<name>:<imageTags.<key> or imageTag>)
images:
  reviewApi: ai-scan-repos-review-api
  gateway: ai-scan-repos-gateway
  frontend: ai-scan-repos-frontend
  scanner: ai-scan-repos-scanner-worker

postgres:
  enabled: true
  image: postgres:16-alpine
  storage: 1Gi
  storageClassName: ""        # "" = cluster default (Docker Desktop: hostpath)
  user: aiscan
  password: aiscan-local-dev-only
  db: aiscan
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {cpu: "1", memory: 1Gi}

reviewApi:
  replicas: 1
  port: 8001
  # HorizontalPodAutoscaler (autoscaling/v2; needs metrics-server). When enabled the Deployment has no
  # spec.replicas, so the HPA (not Argo CD / Helm) owns the replica count. Memory target: unset = CPU only.
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 3
    targetCPUUtilizationPercentage: 70
    # targetMemoryUtilizationPercentage: 80
  resources:
    requests: {cpu: 100m, memory: 128Mi}
    limits: {cpu: 500m, memory: 512Mi}
  # Extra env for review-api (PR #28 compatible: dev mode allows :latest scanner image)
  environment: dev
  skipScannerValidation: true
  # Helm hook Job "review-api-migrate" (post-install/post-upgrade). The Deployment
  # also migrates in an initContainer, so this is an idempotent safety net.
  migrateJob:
    enabled: true

gateway:
  replicas: 1
  port: 8000
  # "" = auto: http://<ingress.host> when ingress is enabled, else http://localhost:8080
  publicUrl: ""
  cookieSecure: false
  allowedUsers: almog975
  adminUsers: almog975
  # Trusted proxy IPs for X-Forwarded-* (local: any; ingress-nginx pod IP varies)
  forwardedAllowIps: "*"
  # Optional pre-created Secret with real GITHUB_CLIENT_ID / GITHUB_CLIENT_SECRET.
  # Loaded after gateway-secrets so it overrides the placeholders. Missing = ignored.
  oauthSecretName: gateway-oauth
  # HorizontalPodAutoscaler (autoscaling/v2; needs metrics-server). When enabled the Deployment has no
  # spec.replicas, so the HPA (not Argo CD / Helm) owns the replica count. Memory target: unset = CPU only.
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 3
    targetCPUUtilizationPercentage: 70
    # targetMemoryUtilizationPercentage: 80
  resources:
    requests: {cpu: 100m, memory: 128Mi}
    limits: {cpu: 500m, memory: 512Mi}

frontend:
  replicas: 1
  port: 8080
  service:
    type: ClusterIP
  # HorizontalPodAutoscaler (autoscaling/v2; needs metrics-server). When enabled the Deployment has no
  # spec.replicas, so the HPA (not Argo CD / Helm) owns the replica count. Memory target: unset = CPU only.
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 3
    targetCPUUtilizationPercentage: 70
    # targetMemoryUtilizationPercentage: 80
  resources:
    requests: {cpu: 100m, memory: 128Mi}
    limits: {cpu: 500m, memory: 512Mi}

scanner:
  imagePullPolicy: IfNotPresent
  activeDeadlineSeconds: 21600
  reportsStorage: 1Gi
  aiProvider: none
  aiModel: local-model
  aiBaseUrl: ""
  # Optional pre-created Secret with real AI_PROVIDER / AI_MODEL / AI_BASE_URL / AI_API_KEY defaults for scanner
  # Jobs (docs/local-secrets.md). Loaded after scanner-secrets (overrides its empty values). Missing = ignored.
  aiSecretName: scanner-ai

ingress:
  enabled: true
  className: nginx
  host: localhost

# NOT FOR PRODUCTION placeholders (same values as deploy/overlays/local/secrets).
# Never commit real values: use --set or a gitignored values.local.yaml.
secrets:
  # false = the chart doesn't render the Secrets (they're created once out-of-band, e.g. by Argo CD setup in
  # docs/cicd-docker-desktop.md), so real OAuth values never have to be in git.
  create: true
  aiKeysEncryptionKey: 000102030405060708090a0b0c0d0e0f101112131415161718191a1b1c1d1e1f
  githubClientId: local-dev-github-client-id
  githubClientSecret: local-dev-github-client-secret-not-for-prod
  githubWebhookSecret: local-dev-webhook-secret-not-for-production
  internalApiToken: local-dev-only-internal-api-token-32b   # >= 32 chars
  aiApiKey: ""

# Auto-heal (ci/heal/heal.sh, docs/autoheal.md): deletes crashed/evicted pods, re-runs a failed
# review-api-migrate Job, restarts Deployments whose /readyz keeps failing, checks postgres.
autoheal:
  enabled: true                 # Role ai-scan-autoheal (namespaced, delete/restart/re-run only)
  jenkins:
    enabled: true               # RoleBinding for the Jenkins job's agent SA (deploy/jenkins/local/)
    namespace: jenkins
    serviceAccount: ai-scan-autoheal
  cronjob:
    enabled: false              # in-cluster alternative without Jenkins
    schedule: "*/10 * * * *"
  image: alpine/k8s:1.31.4
  dryRun: false                 # CronJob only: true = report, change nothing

# Prometheus/Grafana objects for kube-prometheus-stack (infra/helm/kube-prometheus-stack/values-local.yaml).
# Needs its CRDs: install kube-prometheus-stack first, then enable.
monitoring:
  enabled: false
  releaseLabel: kube-prometheus-stack
  scrapeInterval: 30s
