# Non-root nginx on 8080. Static SPA + reverse proxy to gateway.
pid /tmp/nginx.pid;
worker_processes auto;
events { worker_connections 1024; }
http {
  include /etc/nginx/mime.types;
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;
  server_tokens off;
  client_max_body_size 1m;
  # GATEWAY_UPSTREAM is substituted at container start (envsubst), default gateway:8000
  upstream gateway { server ${GATEWAY_UPSTREAM}; }
  server {
    listen 8080;
    root /usr/share/nginx/html;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    # Same values as the Traefik security-headers middleware (infra/k8s/platform/base/ingress.yaml).
    # Only server-level add_header (a location-level add_header would drop all of these).
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Content-Security-Policy "default-src 'self'; connect-src 'self'; img-src 'self' data:; style-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    location = /nginx-health { access_log off; return 200 "ok\n"; }
    location = /me { proxy_pass http://gateway; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; }
    location ~ ^/(api|auth|webhooks)/ {
      proxy_buffering off;   # SSE progress streams
      proxy_pass http://gateway;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 1h;   # SSE; the gateway sends keep-alive comments
    }
    location / { try_files $uri /index.html; }
  }
}
