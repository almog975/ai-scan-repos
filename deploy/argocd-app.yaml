# Argo CD Applications for target k3s. Template: deploy/<name>/overlays/<target>.
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata: {name: ai-scan-frontend-k3s, namespace: argocd}
spec:
  project: default
  source:
    repoURL: https://github.com/almog975/ai-scan-repos.git
    targetRevision: main
    path: deploy/frontend/overlays/k3s
  destination: {server: https://kubernetes.default.svc, namespace: ai-scan-repos}
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions: [CreateNamespace=true]
---
