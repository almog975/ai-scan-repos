# Same stack as deploy/overlays/local, but pulls from GitHub Container Registry
# instead of locally built :latest tags.
#
#   kubectl apply -k deploy/overlays/local-registry
#
# Images are published by .github/workflows/images.yml on every push to main:
#   ghcr.io/almog975/ai-scan-repos-<svc>:latest
#   ghcr.io/almog975/ai-scan-repos-<svc>:sha-<short>
#
# Packages start private. After the first Actions push, make each one Public
# (GitHub → Packages → package → Package settings → Change visibility → Public)
# so anonymous pulls work. See docs/local-k3d.md#github-container-registry.
#
# To pin a specific build, edit newTag / SCANNER_IMAGE below to sha-<short>
# (and keep imagePullPolicy IfNotPresent if you prefer).
# k3s/eks overlays still use the in-cluster registry (Jenkins); switching them
# to ghcr is a follow-up — do not change them here.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../local

# Parent already rewrote ai-scan/<svc> → ai-scan-repos-<svc>:latest; retarget those.
images:
  - name: ai-scan-repos-review-api
    newName: ghcr.io/almog975/ai-scan-repos-review-api
    newTag: latest
  - name: ai-scan-repos-gateway
    newName: ghcr.io/almog975/ai-scan-repos-gateway
    newTag: latest
  - name: ai-scan-repos-frontend
    newName: ghcr.io/almog975/ai-scan-repos-frontend
    newTag: latest

generatorOptions:
  disableNameSuffixHash: true

configMapGenerator:
  - name: scanner-image
    behavior: replace
    literals:
      - SCANNER_IMAGE=ghcr.io/almog975/ai-scan-repos-scanner-worker:latest

patches:
  - path: patches/pull-always.yaml
