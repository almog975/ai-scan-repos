---
apiVersion: v1
kind: ServiceAccount
metadata: {name: review-api, namespace: ai-scan-repos}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: review-api-job-launcher, namespace: ai-scan-repos}
rules:
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [create, get, delete]     # launch, status by known name scan-<id>-b<b>-a<n>, delete (Background GC removes pods)
  - apiGroups: [""]           # per-review AI-key Secret scan-<id>-b<b>-a<n>-ai, owned by the scanner Job
    resources: [secrets]
    verbs: [create, update, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: review-api-job-launcher, namespace: ai-scan-repos}
subjects: [{kind: ServiceAccount, name: review-api, namespace: ai-scan-repos}]
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: review-api-job-launcher}
---
# Scanner pods run with no API access.
apiVersion: v1
kind: ServiceAccount
metadata: {name: scanner, namespace: ai-scan-repos}
automountServiceAccountToken: false
