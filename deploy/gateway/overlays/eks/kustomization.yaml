apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources: [../../base]
images:
  - name: ai-scan/gateway
    newName: registry.ai-scan.example.com/ai-scan/gateway
    newTag: GIT_SHA_PLACEHOLDER
patches:
  - target: {kind: Deployment, name: gateway}
    patch: |
      apiVersion: apps/v1
      kind: Deployment
      metadata: {name: gateway, namespace: ai-scan-repos}
      spec:
        template:
          spec:
            containers:
              - name: gateway
                env:
                  - {name: PUBLIC_URL, value: "https://ai-scan.example.com"}
                  - {name: FORWARDED_ALLOW_IPS, value: "10.40.0.0/16"}   # VPC CIDR (VPC CNI pod IPs), infra/installer/terraform/eks
