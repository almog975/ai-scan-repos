# jenkins/jenkins Helm chart (5.10.3) for Docker Desktop: the auto-heal job + the CI/CD job "ai-scan-cicd"
# (ci/cicd/Jenkinsfile.docker-desktop, docs/cicd-docker-desktop.md). Its credentials (ghcr-push, github-push)
# are created by hand in the Jenkins UI, never in git.
#   helm upgrade --install jenkins jenkins --repo https://charts.jenkins.io --version 5.10.3 \
#     -n jenkins --create-namespace -f deploy/jenkins/local/values-local.yaml --wait
# Full CI setup (multibranch, kaniko, registry, smee) stays in deploy/jenkins/values.yaml (k3s / Argo CD).
fullnameOverride: jenkins

controller:
  image:
    tag: "2.580.2-lts-jdk21"
  servicePort: 8080
  serviceType: ClusterIP
  # Admin user "admin"; the chart generates the password into Secret jenkins/jenkins (key jenkins-admin-password).
  admin:
    username: admin
  numExecutors: 0                    # builds run on Kubernetes agent pods
  resources:
    requests: {cpu: 250m, memory: 768Mi}
    limits: {cpu: "2", memory: 2Gi}
  testEnabled: false
  installLatestPlugins: false
  installLatestSpecifiedPlugins: false
  installPlugins:
    - kubernetes:4560.vc25b_83890c34
    - workflow-aggregator:608.v67378e9d3db_1
    - git:5.11.0
    - configuration-as-code:2141.v3c81c53ddb_f3
    - job-dsl:3732.v9a_c49a_61a_313
    - pipeline-model-definition:2.2293.v6e7193cec599
    - timestamper:1.30
    - credentials-binding:728.v902a_273b_8947
    - junit:1458.v38661c0638e2
  # Jenkins root URL (links in the UI/console). Defaults to http://<ingress.hostName>.
  # Behind the ingress-nginx NodePort fallback, override at install time:
  #   --set controller.jenkinsUrl=http://jenkins.localhost:30080
  ingress:
    enabled: true
    ingressClassName: nginx
    hostName: jenkins.localhost
  JCasC:
    defaultConfig: true
    configScripts:
      ai-scan: |
        jenkins:
          systemMessage: "AI Scan Repos auto-heal (Docker Desktop, deploy/jenkins/local/values-local.yaml)"
        # Don't set unclassified.location here: the chart's default JCasC already sets it
        # (from controller.jenkinsUrl, or the ingress hostName), and a duplicate key makes
        # JCasC fail with ConfiguratorConflictException on boot.
      ai-scan-cicd: |
        jobs:
          - script: >
              pipelineJob('ai-scan-cicd') {
                displayName('AI Scan CI/CD (GitOps)')
                description('Polls GitHub every 2 min: test -> kaniko build -> trivy -> push ghcr.io (git SHA tag) -> bump charts/ai-scan/values-images.yaml [skip ci] -> Argo CD deploys. docs/cicd-docker-desktop.md')
                properties {
                  disableConcurrentBuilds()
                  pipelineTriggers { triggers { pollSCM { scmpoll_spec('H/2 * * * *') } } }
                }
                logRotator { numToKeep(30) }
                definition {
                  cpsScm {
                    scm {
                      git {
                        remote { url('https://github.com/almog975/ai-scan-repos.git') }   // public: clone needs no credentials
                        branch('*/main')
                      }
                    }
                    scriptPath('ci/cicd/Jenkinsfile.docker-desktop')
                    lightweight(false)
                  }
                }
              }
      ai-scan-autoheal: |
        jobs:
          - script: >
              pipelineJob('ai-scan-autoheal') {
                displayName('AI Scan auto-heal')
                description('ci/heal/heal.sh every 10 min + Build Now: delete crashed/evicted pods, re-run a failed migrate Job, restart deployments failing /readyz, check postgres. docs/autoheal.md')
                parameters { booleanParam('DRY_RUN', false, 'Only report what would be healed; change nothing') }
                properties {
                  disableConcurrentBuilds()
                  pipelineTriggers { triggers { cron { spec('H/10 * * * *') } } }
                }
                logRotator { numToKeep(100) }
                definition {
                  cpsScm {
                    scm {
                      git {
                        remote { url('https://github.com/almog975/ai-scan-repos.git') }   // public repo: no credentials
                        branch('*/main')
                      }
                    }
                    scriptPath('ci/heal/Jenkinsfile')
                    lightweight(true)
                  }
                }
              }

persistence:
  enabled: true
  size: 2Gi                          # chart-created PVC (Docker Desktop default StorageClass "hostpath")

serviceAccount:
  create: true
  name: jenkins
rbac:
  create: true                       # Role in ns jenkins only: controller creates/deletes agent pods
  readSecrets: false

agent:
  enabled: true
  namespace: jenkins
  disableDefaultAgent: true
  podTemplates:
    ai-scan-ci: |
      # ci/cicd/Jenkinsfile.docker-desktop. No Docker socket, no privileged pod. ServiceAccount "default" in
      # namespace jenkins has no RBAC: CI never touches the cluster; Argo CD deploys.
      - name: ai-scan-ci
        label: ai-scan-ci
        serviceAccount: default
        nodeUsageMode: EXCLUSIVE
        idleMinutes: 0
        containers:
          - name: jnlp                  # git checkout + the values-images.yaml commit/push
            image: jenkins/inbound-agent:3395.v6e5377b_0fb_3c-1-jdk21
            resourceRequestCpu: 100m
            resourceRequestMemory: 256Mi
            resourceLimitCpu: 500m
            resourceLimitMemory: 512Mi
          - name: python
            image: python:3.12-slim
            command: sleep
            args: "99999999"
            ttyEnabled: true
            resourceRequestCpu: 100m
            resourceRequestMemory: 256Mi
            resourceLimitCpu: "1"
            resourceLimitMemory: 1Gi
          - name: node
            image: node:22-bookworm-slim
            command: sleep
            args: "99999999"
            ttyEnabled: true
            resourceRequestCpu: 100m
            resourceRequestMemory: 512Mi
            resourceLimitCpu: "1"
            resourceLimitMemory: 2Gi
          - name: kaniko                # image builds without a Docker daemon
            image: gcr.io/kaniko-project/executor:v1.23.2-debug
            command: sleep
            args: "99999999"
            ttyEnabled: true
            resourceRequestCpu: 200m
            resourceRequestMemory: 512Mi
            resourceLimitCpu: "2"
            resourceLimitMemory: 3Gi
          - name: trivy
            image: aquasec/trivy:0.58.1
            command: sleep
            args: "99999999"
            ttyEnabled: true
            resourceRequestCpu: 100m
            resourceRequestMemory: 256Mi
            resourceLimitCpu: "1"
            resourceLimitMemory: 2Gi
          - name: crane                 # pushes the scanned tarball to ghcr.io
            image: gcr.io/go-containerregistry/crane:debug
            command: sleep
            args: "99999999"
            ttyEnabled: true
            resourceRequestCpu: 20m
            resourceRequestMemory: 64Mi
            resourceLimitCpu: 500m
            resourceLimitMemory: 256Mi
    autoheal: |
      # ci/heal/Jenkinsfile runs heal.sh in container "kubectl". SA ai-scan-autoheal (deploy/jenkins/local/autoheal-sa.yaml)
      # is bound only to the Role ai-scan-autoheal in ai-scan-repos (charts/ai-scan, autoheal.jenkins.enabled).
      - name: autoheal
        label: autoheal
        serviceAccount: ai-scan-autoheal
        nodeUsageMode: EXCLUSIVE
        idleMinutes: 0
        containers:
          - name: jnlp
            image: jenkins/inbound-agent:3395.v6e5377b_0fb_3c-1-jdk21
            resourceRequestCpu: 100m
            resourceRequestMemory: 256Mi
            resourceLimitCpu: 500m
            resourceLimitMemory: 512Mi
          - name: kubectl
            image: alpine/k8s:1.31.4     # kubectl 1.31 + bash, curl, jq
            command: sleep
            args: infinity
            ttyEnabled: true
            resourceRequestCpu: 20m
            resourceRequestMemory: 64Mi
            resourceLimitCpu: 200m
            resourceLimitMemory: 256Mi
            envVars:
              - envVar: {key: NAMESPACE, value: ai-scan-repos}
