apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources: [../../base]
patches:
  - target: {kind: PersistentVolumeClaim, name: postgres-data}
    patch: |
      - {op: replace, path: /spec/storageClassName, value: gp3}
  - target: {kind: PersistentVolumeClaim, name: postgres-backups}
    patch: |
      - {op: replace, path: /spec/storageClassName, value: gp3}
