apiVersion: apps/v1
kind: StatefulSet
metadata: {name: postgres, namespace: ai-scan-repos, labels: {app: postgres}}
spec:
  serviceName: postgres
  replicas: 1
  selector: {matchLabels: {app: postgres}}
  template:
    metadata: {labels: {app: postgres}}
    spec:
      securityContext: {runAsNonRoot: true, runAsUser: 70, runAsGroup: 70, fsGroup: 70, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports: [{name: pg, containerPort: 5432}]
          envFrom: [{secretRef: {name: db-secrets}}]   # POSTGRES_USER, POSTGRES_PASSWORD, POSTGRES_DB
          env: [{name: PGDATA, value: /var/lib/postgresql/data/pgdata}]
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          resources: {requests: {cpu: 100m, memory: 256Mi}, limits: {cpu: "1", memory: 1Gi}}
          readinessProbe: {exec: {command: [sh, -c, pg_isready -U "$POSTGRES_USER"]}, periodSeconds: 10}
          livenessProbe: {exec: {command: [sh, -c, pg_isready -U "$POSTGRES_USER"]}, periodSeconds: 20, initialDelaySeconds: 30}
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql/data}
            - {name: run, mountPath: /var/run/postgresql}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - {name: data, persistentVolumeClaim: {claimName: postgres-data}}
        - {name: run, emptyDir: {}}
        - {name: tmp, emptyDir: {}}
