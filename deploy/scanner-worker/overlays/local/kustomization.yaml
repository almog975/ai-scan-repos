apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources: [../../base]
namespace: ai-scan-repos
generatorOptions:
  disableNameSuffixHash: true
configMapGenerator:
  - name: scanner-image
    literals:
      - SCANNER_IMAGE=registry.ai-scan.local/ai-scan/scanner-worker:GIT_SHA_PLACEHOLDER
