apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources: [../../base]
namespace: ai-scan-repos
generatorOptions:
  disableNameSuffixHash: true
# Scanner Job pull policy: review-api sets Always (env SCANNER_IMAGE_PULL_POLICY, deploy/review-api/overlays/local).
configMapGenerator:
  - name: scanner-image
    literals:
      - SCANNER_IMAGE=k3d-ai-scan-registry.localhost:5111/ai-scan/scanner-worker:dev
patches:
  - path: networkpolicy-ai-egress.yaml
    target:
      group: networking.k8s.io
      version: v1
      kind: NetworkPolicy
      name: scanner-egress
