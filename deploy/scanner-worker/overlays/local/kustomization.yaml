apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources: [../../base]
namespace: ai-scan-repos
generatorOptions:
  disableNameSuffixHash: true
configMapGenerator:
  - name: scanner-image
    literals:
      - SCANNER_IMAGE=registry.ai-scan.local/ai-scan/scanner-worker:GIT_SHA_PLACEHOLDER
patches:
  - path: networkpolicy-ai-egress.yaml
    target:
      group: networking.k8s.io
      version: v1
      kind: NetworkPolicy
      name: scanner-egress
