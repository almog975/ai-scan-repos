# Single-node local (Docker Desktop / k3d / K3s on laptop): local-path, ai-scan.local host.
# noexec on reports is NOT enforced here (local-path ignores mountOptions) - dev only.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources: [../../base]
patches:
  # local: per-environment egress endpoints (placeholders, RFC 5737). Keep the AI CIDR in sync with
  # deploy/scanner-worker/overlays/local/networkpolicy-ai-egress.yaml. API endpoint: kubectl get endpoints kubernetes -n default.
  - target: {kind: NetworkPolicy, name: review-api-ai-egress}
    patch: |
      - {op: replace, path: /spec/egress/0/to/0/ipBlock/cidr, value: 198.51.100.10/32}   # PLACEHOLDER AI provider CIDR
  - target: {kind: NetworkPolicy, name: review-api-kube-api-egress}
    patch: |
      - {op: replace, path: /spec/egress/0/to/0/ipBlock/cidr, value: 198.51.100.200/32}   # PLACEHOLDER API server endpoint
      - {op: replace, path: /spec/egress/1/to/0/ipBlock/cidr, value: 10.43.0.1/32}   # kubernetes Service IP
