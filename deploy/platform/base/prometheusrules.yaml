# Alerts for AI Scan Repos (docs/monitoring.md). Picked up by kube-prometheus-stack via release=kube-prometheus-stack.
# review-api runs N replicas that each export the same DB-backed gauges: aggregate with max(), never sum().
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: ai-scan-repos
  namespace: ai-scan-repos
  labels: {release: kube-prometheus-stack, app.kubernetes.io/part-of: ai-scan-repos}
spec:
  groups:
    - name: ai-scan-repos.reviews
      rules:
        - alert: AIScanReviewsStuck
          expr: max(reviews_by_state{namespace="ai-scan-repos", state="stuck"}) > 0
          for: 15m
          labels: {severity: warning}
          annotations:
            summary: "{{ $value }} review(s) stuck for more than 15 minutes"
            description: The reconciler relaunches stuck attempts each cycle; a persistent stuck count means relaunches keep failing.
            runbook_url: https://github.com/almog975/ai-scan-repos/blob/main/docs/runbooks/stuck-review.md
        - alert: AIScanReviewFailureRateHigh
          expr: |
            (sum(increase(reviews_total{namespace="ai-scan-repos", state="failed"}[1h]))
              / clamp_min(sum(increase(reviews_total{namespace="ai-scan-repos", state=~"completed|failed"}[1h])), 1)) > 0.25
            and sum(increase(reviews_total{namespace="ai-scan-repos", state=~"completed|failed"}[1h])) >= 4
          for: 15m
          labels: {severity: warning}
          annotations:
            summary: "More than 25% of finished reviews failed in the last hour"
            description: Check scan_attempts_total{outcome="error"}, job_launch_errors_total and ai_provider_requests_total{outcome="error"}.
            runbook_url: https://github.com/almog975/ai-scan-repos/blob/main/docs/monitoring.md#alerts
        - alert: AIScanNoWorkerHeartbeat
          expr: max(reviews_heartbeat_overdue{namespace="ai-scan-repos"}) > 0
          for: 10m
          labels: {severity: warning}
          annotations:
            summary: "{{ $value }} running review(s) without a heartbeat for longer than HEARTBEAT_TIMEOUT_SECONDS"
            description: The scanner Job stopped reporting (OOM, node loss, network policy). The reconciler should mark it stuck within two passes.
            runbook_url: https://github.com/almog975/ai-scan-repos/blob/main/docs/runbooks/stuck-review.md
        - alert: AIScanReconcilerNotRunning
          expr: sum(increase(reconciler_runs_total{namespace="ai-scan-repos", result="ok"}[15m])) == 0
          for: 15m
          labels: {severity: critical}
          annotations:
            summary: No successful reconciler pass in 15 minutes
            description: Stuck/overdue reviews are not being recovered. Check review-api logs ("watchdog pass failed") and the DB.
            runbook_url: https://github.com/almog975/ai-scan-repos/blob/main/docs/monitoring.md#alerts
        - alert: AIScanMetricsDBReadFailing
          expr: max(review_db_metrics_up{namespace="ai-scan-repos"}) == 0
          for: 10m
          labels: {severity: warning}
          annotations:
            summary: review-api cannot read review counts from the database for /metrics
            runbook_url: https://github.com/almog975/ai-scan-repos/blob/main/docs/monitoring.md#alerts
    - name: ai-scan-repos.platform
      rules:
        - alert: AIScanTargetDown
          expr: up{namespace="ai-scan-repos", job=~"review-api|gateway"} == 0
          for: 5m
          labels: {severity: critical}
          annotations:
            summary: "{{ $labels.job }} pod {{ $labels.pod }} is not scrapeable"
            runbook_url: https://github.com/almog975/ai-scan-repos/blob/main/docs/monitoring.md#alerts
        - alert: AIScanPodRestarting
          expr: increase(kube_pod_container_status_restarts_total{namespace="ai-scan-repos"}[15m]) > 2
          for: 5m
          labels: {severity: warning}
          annotations:
            summary: "{{ $labels.pod }}/{{ $labels.container }} restarted {{ $value | humanize }} times in 15m"
            description: Crash loop or failing liveness probe. kubectl -n ai-scan-repos describe pod / logs --previous.
            runbook_url: https://github.com/almog975/ai-scan-repos/blob/main/docs/monitoring.md#alerts
        - alert: AIScanAIProviderErrors
          expr: |
            sum by (kind) (increase(ai_provider_requests_total{namespace="ai-scan-repos", outcome="error"}[30m]))
              / clamp_min(sum by (kind) (increase(ai_provider_requests_total{namespace="ai-scan-repos"}[30m])), 1) > 0.5
          for: 15m
          labels: {severity: warning}
          annotations:
            summary: "More than half of {{ $labels.kind }} AI provider calls failed in 30m"
            description: Reviews still complete (AI enrichment is best effort) but without explanations.
            runbook_url: https://github.com/almog975/ai-scan-repos/blob/main/docs/monitoring.md#alerts
        - alert: AIScanHTTP5xxHigh
          expr: |
            sum by (job) (rate(http_request_duration_seconds_count{namespace="ai-scan-repos", status=~"5.."}[10m]))
              / clamp_min(sum by (job) (rate(http_request_duration_seconds_count{namespace="ai-scan-repos"}[10m])), 1e-9) > 0.05
          for: 10m
          labels: {severity: warning}
          annotations:
            summary: "{{ $labels.job }}: more than 5% of HTTP requests return 5xx"
            runbook_url: https://github.com/almog975/ai-scan-repos/blob/main/docs/monitoring.md#alerts
