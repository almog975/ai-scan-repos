rule_files: [rules.yaml]
tests:
  # provider connection tests answering the contract's 502 must not page AIScanHTTP5xxHigh
  - interval: 1m
    input_series:
      - {series: 'http_request_duration_seconds_count{namespace="ai-scan-repos",job="gateway",method="POST",route="/api/admin/ai-providers/{id}/test",status="502"}', values: '0+5x60'}
      - {series: 'http_request_duration_seconds_count{namespace="ai-scan-repos",job="review-api",method="POST",route="/admin/ai-providers/test",status="502"}', values: '0+5x60'}
      - {series: 'http_request_duration_seconds_count{namespace="ai-scan-repos",job="gateway",method="GET",route="/api/reviews",status="200"}', values: '0+10x60'}
    alert_rule_test:
      - {eval_time: 40m, alertname: AIScanHTTP5xxHigh, exp_alerts: []}
  # ...while real 5xx on other routes still do
  - interval: 1m
    input_series:
      - {series: 'http_request_duration_seconds_count{namespace="ai-scan-repos",job="gateway",method="GET",route="/api/reviews",status="500"}', values: '0+5x60'}
      - {series: 'http_request_duration_seconds_count{namespace="ai-scan-repos",job="gateway",method="GET",route="/api/reviews",status="200"}', values: '0+10x60'}
    alert_rule_test:
      - eval_time: 40m
        alertname: AIScanHTTP5xxHigh
        exp_alerts:
          - exp_labels: {severity: warning, job: gateway}
            exp_annotations:
              summary: "gateway: more than 5% of HTTP requests return 5xx"
