rule_files: [rules.yaml]
tests:
  # every reconciler pass errors since pod start: only result="error" exists -> should page
  - interval: 1m
    input_series:
      - {series: 'reconciler_runs_total{namespace="ai-scan-repos",result="error"}', values: '0+1x60'}
    alert_rule_test:
      - eval_time: 45m
        alertname: AIScanReconcilerNotRunning
        exp_alerts: [{exp_labels: {severity: critical}}]
