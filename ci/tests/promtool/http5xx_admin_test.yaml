rule_files: [rules.yaml]
tests:
  # other admin routes' 5xx must still page
  - interval: 1m
    input_series:
      - {series: 'http_request_duration_seconds_count{namespace="ai-scan-repos",job="gateway",method="POST",route="/api/admin/ai-providers",status="500"}', values: '0+5x60'}
      - {series: 'http_request_duration_seconds_count{namespace="ai-scan-repos",job="gateway",method="GET",route="/x",status="200"}', values: '0+10x60'}
    alert_rule_test:
      - eval_time: 40m
        alertname: AIScanHTTP5xxHigh
        exp_alerts:
          - exp_labels: {severity: warning, job: gateway}
            exp_annotations:
              summary: "gateway: more than 5% of HTTP requests return 5xx"
  - interval: 1m
    input_series:
      - {series: 'http_request_duration_seconds_count{namespace="ai-scan-repos",job="gateway",method="PATCH",route="/api/admin/ai-providers/{id}",status="503"}', values: '0+5x60'}
      - {series: 'http_request_duration_seconds_count{namespace="ai-scan-repos",job="gateway",method="GET",route="/x",status="200"}', values: '0+10x60'}
    alert_rule_test:
      - eval_time: 40m
        alertname: AIScanHTTP5xxHigh
        exp_alerts:
          - exp_labels: {severity: warning, job: gateway}
            exp_annotations:
              summary: "gateway: more than 5% of HTTP requests return 5xx"
  - interval: 1m
    input_series:
      - {series: 'http_request_duration_seconds_count{namespace="ai-scan-repos",job="review-api",method="DELETE",route="/admin/ai-providers/{id}",status="500"}', values: '0+5x60'}
      - {series: 'http_request_duration_seconds_count{namespace="ai-scan-repos",job="review-api",method="GET",route="/x",status="200"}', values: '0+10x60'}
    alert_rule_test:
      - eval_time: 40m
        alertname: AIScanHTTP5xxHigh
        exp_alerts:
          - exp_labels: {severity: warning, job: review-api}
            exp_annotations:
              summary: "review-api: more than 5% of HTTP requests return 5xx"
  - interval: 1m
    input_series:
      - {series: 'http_request_duration_seconds_count{namespace="ai-scan-repos",job="review-api",method="GET",route="/admin/ai-providers",status="500"}', values: '0+5x60'}
      - {series: 'http_request_duration_seconds_count{namespace="ai-scan-repos",job="review-api",method="GET",route="/x",status="200"}', values: '0+10x60'}
    alert_rule_test:
      - eval_time: 40m
        alertname: AIScanHTTP5xxHigh
        exp_alerts:
          - exp_labels: {severity: warning, job: review-api}
            exp_annotations:
              summary: "review-api: more than 5% of HTTP requests return 5xx"
  - interval: 1m
    input_series:
      - {series: 'http_request_duration_seconds_count{namespace="ai-scan-repos",job="gateway",method="POST",route="/api/admin/ai-providers/testing",status="500"}', values: '0+5x60'}
      - {series: 'http_request_duration_seconds_count{namespace="ai-scan-repos",job="gateway",method="GET",route="/x",status="200"}', values: '0+10x60'}
    alert_rule_test:
      - eval_time: 40m
        alertname: AIScanHTTP5xxHigh
        exp_alerts:
          - exp_labels: {severity: warning, job: gateway}
            exp_annotations:
              summary: "gateway: more than 5% of HTTP requests return 5xx"
