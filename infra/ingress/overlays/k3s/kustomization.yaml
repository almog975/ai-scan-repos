apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources: [../../base]
patches:
  - target: {kind: IngressRoute, name: jenkins}
    patch: |
      - {op: replace, path: /spec/routes/0/match, value: "Host(`jenkins.ai-scan.127.0.0.1.nip.io`)"}
  - target: {kind: IngressRoute, name: jenkins-http}
    patch: |
      - {op: replace, path: /spec/routes/0/match, value: "Host(`jenkins.ai-scan.127.0.0.1.nip.io`)"}
  - target: {kind: IngressRoute, name: argocd}
    patch: |
      - {op: replace, path: /spec/routes/0/match, value: "Host(`argocd.ai-scan.127.0.0.1.nip.io`)"}
  - target: {kind: IngressRoute, name: argocd-http}
    patch: |
      - {op: replace, path: /spec/routes/0/match, value: "Host(`argocd.ai-scan.127.0.0.1.nip.io`)"}
