apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources: [../../base]  # StorageClass efs-sc: infra/bootstrap/cluster/overlays/eks
patches:
  - target: {kind: PersistentVolumeClaim, name: reports}
    patch: |
      - {op: replace, path: /spec/accessModes, value: [ReadWriteMany]}
      - {op: replace, path: /spec/storageClassName, value: efs-sc}
  # EKS TLS placeholder: either terminate at the NLB/ALB with an ACM cert (then drop `tls` and route on `web`),
  # or let cert-manager (ClusterIssuer letsencrypt) issue Secret ai-scan-tls.
  - target: {kind: IngressRoute, name: ai-scan}
    patch: |
      - op: replace
        path: /spec/routes/0/match
        value: Host(`ai-scan.example.com`) && PathRegexp(`^/api/reviews/[^/]+/progress$`)
      - op: replace
        path: /spec/routes/1/match
        value: Host(`ai-scan.example.com`) && (PathPrefix(`/api`) || PathPrefix(`/auth`) || PathPrefix(`/me`) || PathPrefix(`/webhooks`))
      - op: replace
        path: /spec/routes/2/match
        value: Host(`ai-scan.example.com`) && PathPrefix(`/`)
  - target: {kind: IngressRoute, name: ai-scan-http}
    patch: |
      - op: replace
        path: /spec/routes/0/match
        value: Host(`ai-scan.example.com`)
  # eks: per-environment egress endpoints (placeholders, RFC 5737). Keep the AI CIDR in sync with
  # infra/k8s/scanner-worker/overlays/eks/networkpolicy-ai-egress.yaml. API endpoint: kubectl get endpoints kubernetes -n default.
  - target: {kind: NetworkPolicy, name: review-api-ai-egress}
    patch: |
      - {op: replace, path: /spec/egress/0/to, value: [{ipBlock: {cidr: 203.0.113.0/24}}]}   # PLACEHOLDER AI provider CIDRs (installer: AI_EGRESS_CIDRS)
  - target: {kind: NetworkPolicy, name: review-api-kube-api-egress}
    patch: |
      - {op: replace, path: /spec/egress/0/to/0/ipBlock/cidr, value: 198.51.100.202/32}   # PLACEHOLDER API server endpoint (installer: KUBE_API_ENDPOINT)
      - {op: replace, path: /spec/egress/1/to/0/ipBlock/cidr, value: 172.20.0.1/32}   # kubernetes Service IP (installer: KUBE_SERVICE_IP)
