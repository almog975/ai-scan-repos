apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources: [default-sa.yaml, pvcs.yaml, reports-cleanup.yaml, ingress.yaml, servicemonitors.yaml, prometheusrules.yaml, networkpolicies.yaml, autoheal-rbac.yaml]
# Grafana dashboard: the kube-prometheus-stack sidecar loads ConfigMaps labelled grafana_dashboard=1
# (searchNamespace ai-scan-repos, infra/helm/kube-prometheus-stack/values.yaml). Source: dashboards/*.json.
configMapGenerator:
  - name: grafana-dashboard-ai-scan-repos
    namespace: ai-scan-repos
    files: [dashboards/ai-scan-repos.json]
    options:
      disableNameSuffixHash: true
      labels: {grafana_dashboard: "1", app.kubernetes.io/part-of: ai-scan-repos}
      annotations: {grafana_folder: AI Scan Repos}
