# Ingress lockdown for ns ai-scan-repos: default-deny, then only the paths the app needs.
# Traefik is selected by namespace (kube-system on K3s, also used by the installer for local/EKS) + its standard pod
# label; Prometheus by namespace "monitoring" + app.kubernetes.io/name=prometheus. Change them in an overlay if Traefik/Prometheus live elsewhere.
# Kubelet probes are node traffic and are not affected.
# Egress (Phase 9): default-deny for every pod, then explicit allows below. scanner-egress (infra/k8s/scanner-worker)
# and reports-cleanup-deny-all keep their own rules; policies are additive, so DNS here also applies to them.
# Per-overlay placeholders (patches in infra/k8s/platform/overlays/<env>/kustomization.yaml): AI provider CIDRs and
# the K8s API server endpoint. NetworkPolicy matches IPs, not hostnames.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: default-deny-ingress, namespace: ai-scan-repos}
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: default-deny-egress, namespace: ai-scan-repos}
spec:
  podSelector: {}
  policyTypes: [Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: allow-dns-egress, namespace: ai-scan-repos}
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: kube-system}}
          podSelector: {matchLabels: {k8s-app: kube-dns}}
      ports: [{protocol: UDP, port: 53}, {protocol: TCP, port: 53}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: postgres-clients-egress, namespace: ai-scan-repos}
spec:
  podSelector:
    matchExpressions: [{key: app, operator: In, values: [review-api, gateway, review-api-migrate, postgres-backup]}]
  policyTypes: [Egress]
  egress:
    - to: [{podSelector: {matchLabels: {app: postgres}}}]
      ports: [{protocol: TCP, port: 5432}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: frontend-egress, namespace: ai-scan-repos}
spec:
  podSelector: {matchLabels: {app: frontend}}
  policyTypes: [Egress]
  egress:
    - to: [{podSelector: {matchLabels: {app: gateway}}}]   # nginx proxy_pass gateway:8000
      ports: [{protocol: TCP, port: 8000}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: gateway-egress, namespace: ai-scan-repos}
spec:
  podSelector: {matchLabels: {app: gateway}}
  policyTypes: [Egress]
  egress:
    - to: [{podSelector: {matchLabels: {app: review-api}}}]
      ports: [{protocol: TCP, port: 8001}]
---
