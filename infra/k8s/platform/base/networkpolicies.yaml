# review-api -> AI providers (app/providers/*). Placeholder (RFC 5737), replaced per overlay.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: review-api-ai-egress, namespace: ai-scan-repos}
spec:
  podSelector: {matchLabels: {app: review-api}}
  policyTypes: [Egress]
  egress:
    - to: [{ipBlock: {cidr: 192.0.2.0/24}}]   # PLACEHOLDER, overlay patch
      ports: [{protocol: TCP, port: 443}]
---
# review-api -> K8s API (creates scanner Jobs, Role review-api-job-launcher). kube-router/VPC-CNI evaluate the
# post-DNAT endpoint, so list the API server endpoint IP(s) (kubectl get endpoints kubernetes -n default), plus the
# Service IP for CNIs that match pre-DNAT. Placeholders, replaced per overlay.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: review-api-kube-api-egress, namespace: ai-scan-repos}
spec:
  podSelector: {matchLabels: {app: review-api}}
  policyTypes: [Egress]
  egress:
    - to: [{ipBlock: {cidr: 198.51.100.200/32}}]   # PLACEHOLDER: API server endpoint
      ports: [{protocol: TCP, port: 6443}, {protocol: TCP, port: 443}]
    - to: [{ipBlock: {cidr: 10.43.0.1/32}}]       # kubernetes Service IP (K3s default; eks overlay patches)
      ports: [{protocol: TCP, port: 443}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: postgres-ingress, namespace: ai-scan-repos}
spec:
  podSelector: {matchLabels: {app: postgres}}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {matchLabels: {app: review-api}}
        - podSelector: {matchLabels: {app: gateway}}
        - podSelector: {matchLabels: {app: review-api-migrate}}   # migrations Job (alembic upgrade head)
        - podSelector: {matchLabels: {app: postgres-backup}}      # pg_dump CronJob (postgres-backup.yaml)
      ports: [{protocol: TCP, port: 5432}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: review-api-ingress, namespace: ai-scan-repos}
spec:
  podSelector: {matchLabels: {app: review-api}}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {matchLabels: {app: gateway}}
        - podSelector: {matchLabels: {app: scanner}}
      ports: [{protocol: TCP, port: 8001}]
    - from:   # /metrics scrape (ServiceMonitor review-api)
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: monitoring}}
          podSelector: {matchLabels: {app.kubernetes.io/name: prometheus}}
      ports: [{protocol: TCP, port: 8001}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: gateway-ingress, namespace: ai-scan-repos}
spec:
  podSelector: {matchLabels: {app: gateway}}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: kube-system}}
          podSelector: {matchLabels: {app.kubernetes.io/name: traefik}}
      ports: [{protocol: TCP, port: 8000}]
    - from:   # nginx in the frontend proxies /api,/auth,/me,/webhooks to the gateway (same nginx.conf as compose)
        - podSelector: {matchLabels: {app: frontend}}
      ports: [{protocol: TCP, port: 8000}]
    - from:   # /metrics scrape (ServiceMonitor gateway)
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: monitoring}}
          podSelector: {matchLabels: {app.kubernetes.io/name: prometheus}}
      ports: [{protocol: TCP, port: 8000}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: frontend-ingress, namespace: ai-scan-repos}
spec:
  podSelector: {matchLabels: {app: frontend}}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: kube-system}}
          podSelector: {matchLabels: {app.kubernetes.io/name: traefik}}
      ports: [{protocol: TCP, port: 8080}]
