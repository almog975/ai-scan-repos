---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata: {name: review-api, namespace: ai-scan-repos, labels: {release: kube-prometheus-stack}}
spec:
  selector: {matchLabels: {app: review-api}}
  endpoints: [{port: http, path: /metrics, interval: 30s}]
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata: {name: gateway, namespace: ai-scan-repos, labels: {release: kube-prometheus-stack}}
spec:
  selector: {matchLabels: {app: gateway}}
  endpoints: [{port: http, path: /metrics, interval: 30s}]
