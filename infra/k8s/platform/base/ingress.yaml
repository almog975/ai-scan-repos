# K3s bundled Traefik (traefik.io/v1alpha1 CRDs). Host is ai-scan.local here (local overlay); k3s/eks patch it.
# TLS: entryPoint websecure + Secret ai-scan-tls (docs/tls-runbook.md); web (:80) only redirects to https.
# SSE: GET /api/reviews/{id}/progress (services/contracts/gateway.openapi.yaml) streams text/event-stream through the
# gateway. Traefik only buffers when the `buffering` middleware is attached - NEVER attach it to /api routes.
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata: {name: security-headers, namespace: ai-scan-repos}
spec:
  headers:
    # Same values as services/frontend/nginx.conf. browserXssFilter removed (X-XSS-Protection is deprecated; CSP covers it).
    contentSecurityPolicy: "default-src 'self'; connect-src 'self'; img-src 'self' data:; style-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
    permissionsPolicy: "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
    frameDeny: true                       # X-Frame-Options: DENY
    contentTypeNosniff: true              # X-Content-Type-Options: nosniff
    referrerPolicy: strict-origin-when-cross-origin
    stsSeconds: 31536000
    stsIncludeSubdomains: true
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata: {name: api-ratelimit, namespace: ai-scan-repos}
spec:
  rateLimit: {average: 50, burst: 100}
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata: {name: redirect-https, namespace: ai-scan-repos}
spec:
  redirectScheme: {scheme: https, permanent: true}
---
# Long-lived SSE streams: no response-header timeout, keep idle upstream conns.
apiVersion: traefik.io/v1alpha1
kind: ServersTransport
metadata: {name: gateway-sse, namespace: ai-scan-repos}
spec:
  forwardingTimeouts:
    dialTimeout: 30s
    responseHeaderTimeout: 0s
    idleConnTimeout: 300s
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata: {name: ai-scan, namespace: ai-scan-repos}
spec:
  entryPoints: [websecure]
  routes:
    # 0: SSE progress stream - no buffering middleware, immediate flush, SSE transport.
    - match: Host(`ai-scan.local`) && PathRegexp(`^/api/reviews/[^/]+/progress$`)
      kind: Rule
      priority: 200
      middlewares: [{name: security-headers}, {name: api-ratelimit}]
      services:
        - name: gateway
          port: 8000
          serversTransport: gateway-sse
          responseForwarding: {flushInterval: 100ms}   # Traefik also auto-flushes text/event-stream
    # 1: API + auth + webhooks -> gateway (no buffering middleware here either)
    - match: Host(`ai-scan.local`) && (PathPrefix(`/api`) || PathPrefix(`/auth`) || PathPrefix(`/me`) || PathPrefix(`/webhooks`))
      kind: Rule
      priority: 100
      middlewares: [{name: security-headers}, {name: api-ratelimit}]
      services: [{name: gateway, port: 8000}]
    # 2: SPA
    - match: Host(`ai-scan.local`) && PathPrefix(`/`)
      kind: Rule
      priority: 10
      middlewares: [{name: security-headers}]
      services: [{name: frontend, port: 8080}]
  tls:
    secretName: ai-scan-tls   # self-signed or cert-manager; see docs/tls-runbook.md
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata: {name: ai-scan-http, namespace: ai-scan-repos}
spec:
  entryPoints: [web]
  routes:
    - match: Host(`ai-scan.local`)
      kind: Rule
      middlewares: [{name: security-headers}, {name: redirect-https}]
      services: [{name: frontend, port: 8080}]   # never reached; redirect answers first
# review-api is intentionally NOT routed.
