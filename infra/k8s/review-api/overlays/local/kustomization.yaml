apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources: [../../base]
images:
  - name: ai-scan/review-api
    newName: k3d-ai-scan-registry.localhost:5111/ai-scan/review-api
    newTag: dev
# :dev is rebuilt and re-pushed by infra/local/k3d.sh, so always pull from the k3d registry (cheap, same host).
patches:
  - target: {kind: Deployment, name: review-api}
    patch: |
      - {op: add, path: /spec/template/spec/containers/0/imagePullPolicy, value: Always}
  - target: {kind: Job, name: review-api-migrate}
    patch: |
      - {op: add, path: /spec/template/spec/containers/0/imagePullPolicy, value: Always}
  # scanner Jobs: pull the re-pushed :dev on every scan (review-api sets imagePullPolicy on the Job it creates)
  - target: {kind: Deployment, name: review-api}
    patch: |
      - {op: add, path: /spec/template/spec/containers/0/env/-, value: {name: SCANNER_IMAGE_PULL_POLICY, value: Always}}
