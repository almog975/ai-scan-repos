apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources: [../../base]
images:
  - name: ai-scan/gateway
    newName: registry.registry:5000/ai-scan/gateway
    newTag: GIT_SHA_PLACEHOLDER
patches:
  - target: {kind: Deployment, name: gateway}
    patch: |
      # Must match the k3s IngressRoute host (infra/k8s/platform/overlays/k3s). Base ai-scan.local is not served on k3s.
      # GitHub OAuth App callback: https://ai-scan.127.0.0.1.nip.io/auth/github/callback
      - {op: replace, path: /spec/template/spec/containers/0/env/2, value: {name: PUBLIC_URL, value: "https://ai-scan.127.0.0.1.nip.io"}}
      - {op: add, path: /spec/template/spec/containers/0/imagePullPolicy, value: IfNotPresent}   # immutable sha tags
