---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: registry-data, namespace: registry}
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources: {requests: {storage: 20Gi}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: registry, namespace: registry, labels: {app: registry}}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector: {matchLabels: {app: registry}}
  template:
    metadata: {labels: {app: registry}}
    spec:
      automountServiceAccountToken: false   # registry never calls the K8s API
      securityContext: {runAsNonRoot: true, runAsUser: 1000, runAsGroup: 1000, fsGroup: 1000, fsGroupChangePolicy: OnRootMismatch, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: registry
          image: registry:2.8.3
          ports: [{name: http, containerPort: 5000}]
          env:
            - {name: REGISTRY_STORAGE_DELETE_ENABLED, value: "true"}
            # htpasswd auth: Secret registry-htpasswd (key htpasswd), created per docs/registry-auth-runbook.md
            - {name: REGISTRY_AUTH, value: htpasswd}
            - {name: REGISTRY_AUTH_HTPASSWD_REALM, value: ai-scan-registry}
            - {name: REGISTRY_AUTH_HTPASSWD_PATH, value: /auth/htpasswd}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          resources: {requests: {cpu: 50m, memory: 64Mi}, limits: {cpu: 500m, memory: 512Mi}}
          readinessProbe: {httpGet: {path: /, port: 5000}}
          livenessProbe: {httpGet: {path: /, port: 5000}}
          volumeMounts:
            - {name: data, mountPath: /var/lib/registry}
            - {name: auth, mountPath: /auth, readOnly: true}
      volumes:
        - {name: data, persistentVolumeClaim: {claimName: registry-data}}
        - name: auth
          secret: {secretName: registry-htpasswd, items: [{key: htpasswd, path: htpasswd}]}
---
apiVersion: v1
kind: Service
metadata: {name: registry, namespace: registry, labels: {app: registry}}
spec:
  type: ClusterIP
  selector: {app: registry}
  ports: [{name: http, port: 5000, targetPort: 5000}]
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata: {name: large-body, namespace: registry}
spec:
  buffering: {maxRequestBodyBytes: 0}
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata: {name: registry, namespace: registry}
spec:
  entryPoints: [websecure]
  routes:
    - match: Host(`registry.ai-scan.local`)
      kind: Rule
      services: [{name: registry, port: 5000}]
  tls: {secretName: registry-tls}
---
# Phase 9: registry needs no egress except DNS; ingress only from Traefik (pushes/pulls incl. kubelet pulls, which
# arrive via the Traefik pod) and from ns jenkins (in-cluster registry.registry:5000).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: default-deny, namespace: registry}
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
  egress:
    - to:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: kube-system}}
          podSelector: {matchLabels: {k8s-app: kube-dns}}
      ports: [{protocol: UDP, port: 53}, {protocol: TCP, port: 53}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: registry-ingress, namespace: registry}
spec:
  podSelector: {matchLabels: {app: registry}}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: kube-system}}
          podSelector: {matchLabels: {app.kubernetes.io/name: traefik}}
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: jenkins}}
      ports: [{protocol: TCP, port: 5000}]
