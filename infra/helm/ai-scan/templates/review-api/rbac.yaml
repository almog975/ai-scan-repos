# review-api launches one scanner Job per review (same rules as infra/k8s/review-api/base/rbac.yaml)
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: review-api-job-launcher
  labels: {{- include "ai-scan.labels" . | nindent 4 }}
rules:
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [create, get, delete]
  - apiGroups: [""]
    resources: [secrets]
    verbs: [create, update, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: review-api-job-launcher
  labels: {{- include "ai-scan.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: review-api-job-launcher
subjects:
  - kind: ServiceAccount
    name: review-api
    namespace: {{ .Release.Namespace }}
