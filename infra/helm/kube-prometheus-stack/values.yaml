# kube-prometheus-stack values for K3s (Traefik ingress, local-path storage).
prometheus:
  prometheusSpec:
    retention: 7d
    retentionSize: 8GB
    # pick up ServiceMonitors labelled release=kube-prometheus-stack in any namespace
    serviceMonitorSelector:
      matchLabels: {release: kube-prometheus-stack}
    serviceMonitorNamespaceSelector: {}
    # PrometheusRules (infra/k8s/platform/base/prometheusrules.yaml) use the same release label
    ruleSelectorNilUsesHelmValues: false
    ruleSelector:
      matchLabels: {release: kube-prometheus-stack}
    ruleNamespaceSelector: {}
    resources: {requests: {cpu: 200m, memory: 512Mi}, limits: {memory: 2Gi}}
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: local-path
          accessModes: [ReadWriteOnce]
          resources: {requests: {storage: 10Gi}}
alertmanager:
  alertmanagerSpec:
    resources: {requests: {cpu: 10m, memory: 32Mi}, limits: {cpu: 100m, memory: 128Mi}}
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: local-path
          accessModes: [ReadWriteOnce]
          resources: {requests: {storage: 1Gi}}
grafana:
  resources: {requests: {cpu: 50m, memory: 128Mi}, limits: {cpu: 500m, memory: 512Mi}}
  # dashboards ship as ConfigMaps labelled grafana_dashboard=1 next to the app (docs/monitoring.md).
  # Only the app namespace is watched (plus the chart's own), not ALL: keeps the sidecar's RBAC narrow.
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      labelValue: "1"
      searchNamespace: [ai-scan-repos]
      folderAnnotation: grafana_folder
      provider: {foldersFromFilesStructure: true}
  admin:
    existingSecret: grafana-admin   # keys: admin-user, admin-password
  persistence:
    enabled: true
    storageClassName: local-path
    size: 2Gi
  ingress:
    enabled: true
    ingressClassName: traefik
    annotations:
      traefik.ingress.kubernetes.io/router.entrypoints: websecure
      traefik.ingress.kubernetes.io/router.tls: "true"
    hosts: [grafana.ai-scan.local]
# K3s: these control-plane components are not scrapeable as separate pods
kubeEtcd: {enabled: false}
kubeControllerManager: {enabled: false}
kubeScheduler: {enabled: false}
kubeProxy: {enabled: false}
# App ServiceMonitors (review-api :8001, gateway :8000), PrometheusRules and the Grafana dashboard live in
# infra/k8s/platform/base (servicemonitors.yaml, prometheusrules.yaml, dashboards/). See docs/monitoring.md.
# Phase 9: requests/limits for the remaining chart components (sized for a single-node K3s lab).
prometheusOperator:
  resources: {requests: {cpu: 50m, memory: 64Mi}, limits: {cpu: 200m, memory: 256Mi}}
  prometheusConfigReloader:
    resources: {requests: {cpu: 10m, memory: 16Mi}, limits: {cpu: 100m, memory: 64Mi}}
kube-state-metrics:
  resources: {requests: {cpu: 10m, memory: 64Mi}, limits: {cpu: 200m, memory: 256Mi}}
prometheus-node-exporter:
  resources: {requests: {cpu: 10m, memory: 32Mi}, limits: {cpu: 200m, memory: 64Mi}}
