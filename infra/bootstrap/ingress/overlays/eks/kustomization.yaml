apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources: [../../base]
# EKS: hosts are placeholders; TLS via ACM at the LB or cert-manager.
patches:
  - target: {kind: IngressRoute, name: jenkins}
    patch: |
      - {op: replace, path: /spec/routes/0/match, value: "Host(`jenkins.ai-scan.example.com`)"}
  - target: {kind: IngressRoute, name: jenkins-http}
    patch: |
      - {op: replace, path: /spec/routes/0/match, value: "Host(`jenkins.ai-scan.example.com`)"}
  - target: {kind: IngressRoute, name: argocd}
    patch: |
      - {op: replace, path: /spec/routes/0/match, value: "Host(`argocd.ai-scan.example.com`)"}
  - target: {kind: IngressRoute, name: argocd-http}
    patch: |
      - {op: replace, path: /spec/routes/0/match, value: "Host(`argocd.ai-scan.example.com`)"}
