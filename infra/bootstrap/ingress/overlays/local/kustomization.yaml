# Local (k3d, infra/bootstrap/local/k3d.sh): hosts argocd.ai-scan.localhost / jenkins.ai-scan.localhost
# (*.localhost resolves to 127.0.0.1 in browsers). TLS secrets argocd-ingress-tls / jenkins-tls are not created
# locally: Traefik serves its default self-signed cert. Argo CD is normally reached via port-forward.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources: [../../base]
patches:
  - target: {kind: IngressRoute, name: argocd}
    patch: |
      - {op: replace, path: /spec/routes/0/match, value: "Host(`argocd.ai-scan.localhost`)"}
  - target: {kind: IngressRoute, name: argocd-http}
    patch: |
      - {op: replace, path: /spec/routes/0/match, value: "Host(`argocd.ai-scan.localhost`)"}
  - target: {kind: IngressRoute, name: jenkins}
    patch: |
      - {op: replace, path: /spec/routes/0/match, value: "Host(`jenkins.ai-scan.localhost`)"}
  - target: {kind: IngressRoute, name: jenkins-http}
    patch: |
      - {op: replace, path: /spec/routes/0/match, value: "Host(`jenkins.ai-scan.localhost`)"}
