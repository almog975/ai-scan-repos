# Traefik routes for Jenkins (ns jenkins) and Argo CD (ns argocd). Applied by the installer, not Argo CD.
# Middlewares are COPIED per namespace (same values as infra/k8s/platform/base/ingress.yaml security-headers)
# so we don't need Traefik providers.kubernetesCRD.allowCrossNamespace=true (off by default in K3s Traefik).
# TLS secrets jenkins-tls / argocd-ingress-tls.
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata: {name: security-headers, namespace: jenkins}
spec:
  headers:
    frameDeny: true
    contentTypeNosniff: true
    referrerPolicy: strict-origin-when-cross-origin
    stsSeconds: 31536000
    stsIncludeSubdomains: true
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata: {name: redirect-https, namespace: jenkins}
spec:
  redirectScheme: {scheme: https, permanent: true}
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata: {name: jenkins, namespace: jenkins}
spec:
  entryPoints: [websecure]
  routes:
    - match: Host(`jenkins.ai-scan.local`)
      kind: Rule
      middlewares: [{name: security-headers}]
      services: [{name: jenkins, port: 8080}]
  tls: {secretName: jenkins-tls}
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata: {name: jenkins-http, namespace: jenkins}
spec:
  entryPoints: [web]
  routes:
    - match: Host(`jenkins.ai-scan.local`)
      kind: Rule
      middlewares: [{name: redirect-https}]
      services: [{name: jenkins, port: 8080}]
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata: {name: security-headers, namespace: argocd}
spec:
  headers:
    frameDeny: true
    contentTypeNosniff: true
    referrerPolicy: strict-origin-when-cross-origin
    stsSeconds: 31536000
    stsIncludeSubdomains: true
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata: {name: redirect-https, namespace: argocd}
spec:
  redirectScheme: {scheme: https, permanent: true}
---
# argocd-server must run with --insecure (Helm: configs.params."server.insecure"=true); TLS ends at Traefik.
# CLI: argocd login argocd.<domain> --grpc-web
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata: {name: argocd, namespace: argocd}
spec:
  entryPoints: [websecure]
  routes:
    - match: Host(`argocd.ai-scan.local`)
      kind: Rule
      middlewares: [{name: security-headers}]
      services: [{name: argocd-server, port: 80}]
  tls: {secretName: argocd-ingress-tls}
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata: {name: argocd-http, namespace: argocd}
spec:
  entryPoints: [web]
  routes:
    - match: Host(`argocd.ai-scan.local`)
      kind: Rule
      middlewares: [{name: redirect-https}]
      services: [{name: argocd-server, port: 80}]
