# AppProject for the child Applications (infra/argocd/apps/*.yaml).
# Apply BEFORE infra/argocd/root-app.yaml. Cluster-scoped objects (namespaces, PV, StorageClasses) live in
# infra/bootstrap and are applied by the installer, so only Namespace is whitelisted (CreateNamespace).
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: ai-scan
  namespace: argocd
spec:
  description: AI Scan Repos
  sourceRepos:
    - https://github.com/almog975/ai-scan-repos.git
    - https://github.com/almog975/ai-scan-repos
  destinations:
    - server: https://kubernetes.default.svc
      namespace: ai-scan-repos
  clusterResourceWhitelist:
    - {group: "", kind: Namespace}
  namespaceResourceWhitelist:
    - {group: "*", kind: "*"}
