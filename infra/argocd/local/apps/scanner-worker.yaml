# Child of infra/argocd/local/root-app.yaml (k3d). Sync wave 2.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ai-scan-scanner-worker-local
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: default
  source:
    repoURL: https://github.com/almog975/ai-scan-repos.git
    targetRevision: main
    path: infra/k8s/scanner-worker/overlays/local
  destination:
    server: https://kubernetes.default.svc
    namespace: ai-scan-repos
  # Egress endpoints are cluster-specific: infra/bootstrap/local/k3d.sh (aiscan-install.sh egress) fills AI_EGRESS_CIDRS and
  # KUBE_API_ENDPOINT on apply. Argo CD must not revert them to the committed placeholders (docs/local-k3d.md).
  ignoreDifferences:
    - group: networking.k8s.io
      kind: NetworkPolicy
      name: scanner-egress
      namespace: ai-scan-repos
      jsonPointers: [/spec/egress]
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - RespectIgnoreDifferences=true
