# Child of infra/argocd/root-app.yaml (app-of-apps). Sync wave 2.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ai-scan-review-api-k3s
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: ai-scan
  source:
    repoURL: https://github.com/almog975/ai-scan-repos.git
    targetRevision: main
    path: infra/k8s/review-api/overlays/k3s
  destination:
    server: https://kubernetes.default.svc
    namespace: ai-scan-repos
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
