# Restores Application health assessment (removed in Argo CD 1.8) so app-of-apps sync waves wait for each
# child to be Healthy. Apply:
#   kubectl -n argocd patch cm argocd-cm --type merge --patch-file infra/argocd/argocd-cm-health-patch.yaml
# Helm alternative: same key under configs.cm in the argo-cd chart values.
data:
  resource.customizations.health.argoproj.io_Application: |
    hs = {}
    hs.status = "Progressing"
    hs.message = ""
    if obj.status ~= nil then
      if obj.status.health ~= nil then
        hs.status = obj.status.health.status
        if obj.status.health.message ~= nil then
          hs.message = obj.status.health.message
        end
      end
    end
    return hs
